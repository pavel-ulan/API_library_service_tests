# Defaults. Override with -D<key> (e.g. -DbaseUrl=http://host:8080) or environment variables (BASE_URL, ...).

# Where the Library API runs
base.url=http://localhost:8080
# Base path of the API endpoints
api.base-path=/api/v1
# OpenAPI spec used for contract validation. Empty = <base.url>/openapi/library-api.yaml (served by the service)
spec.url=
# Validate every API response against the OpenAPI spec
contract.validation=true
