name: API tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      service_ref:
        description: Branch, tag or commit of the service to test
        required: false
        default: main

env:
  # Service under test. If the repository is private, add a SERVICE_REPO_TOKEN secret
  # (a token with read access to it).
  SERVICE_REPO: pavel-ulan/API_library_service
  BASE_URL: http://localhost:8080

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out tests
        uses: actions/checkout@v4
        with:
          path: tests

      - name: Select service revision
        id: service-ref
        shell: bash
        env:
          REQUESTED_REF: ${{ inputs.service_ref }}
        run: |
          ref="$REQUESTED_REF"
          if [ -z "$ref" ] && [[ "$GITHUB_HEAD_REF" == agent/openapi-* ]] && [ -f tests/.github/agent-service-ref.txt ]; then
            ref=$(cat tests/.github/agent-service-ref.txt)
            [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || exit 1
          fi
          echo "ref=${ref:-main}" >> "$GITHUB_OUTPUT"

      - name: Check out service
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SERVICE_REPO }}
          ref: ${{ steps.service-ref.outputs.ref }}
          path: service
          token: ${{ secrets.SERVICE_REPO_TOKEN || github.token }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            tests/pom.xml
            service/pom.xml

      - name: Build service
        working-directory: service
        run: mvn -B -ntp -DskipTests package

      - name: Start service
        run: |
          nohup java -jar service/target/library-api.jar > service.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fs "$BASE_URL/actuator/health" > /dev/null; then
              echo "Service is up"
              exit 0
            fi
            sleep 1
          done
          echo "Service did not start in 60 seconds"
          cat service.log
          exit 1

      - name: Run API tests
        working-directory: tests
        run: mvn -B -ntp test -DbaseUrl="$BASE_URL"

      - name: Generate Allure report
        if: always()
        working-directory: tests
        run: mvn -B -ntp allure:report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: tests/target/allure-report
          if-no-files-found: warn

      - name: Upload Allure results and service log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: |
            tests/target/allure-results
            service.log
          if-no-files-found: warn
